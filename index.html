<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D5E7F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="푸른하늘" />
    <title>푸른하늘</title>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="assets/icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="assets/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="style.css?v=2026.10.07-kb2" />
  </head>
  <body>
    <!-- 시작 화면: 앱을 열면 4.5초 보여 주고 사르르 사라져요 (app.js 가 닫아요) -->
    <div id="splash" role="img" aria-label="푸른하늘, 탄소 절약 내비게이션 앱">
      <div class="sp-sky" aria-hidden="true">
        <span class="sp-sun"></span>
        <span class="sp-cloud c1"></span><span class="sp-cloud c2"></span><span class="sp-cloud c3"></span><span class="sp-cloud c4"></span><span class="sp-cloud c5"></span>
      </div>
      <p class="splash-txt">탄소 절약 내비게이션 앱</p>
      <div class="sp-logo" aria-hidden="true">
        <span class="sp-halo"></span>
        <span class="sp-float"><img class="splash-ic" src="assets/icon-512.png?v=2" alt="" width="112" height="112" /></span>
        <span class="sp-shadow"></span>
      </div>
      <div class="sp-bar" aria-hidden="true"><i></i></div>
    </div>
    <!-- 앱 화면은 app.js 가 이 안에 그려요 -->
    <div id="app" class="shell"></div>

    <script src="config.js?v=2026.10.07-kb2"></script>
    <script src="app.js?v=2026.10.07-kb2"></script>
  </body>
</html>
