<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>푸른하늘 · 시연</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="demo.css?v=2026.10.11-phone5" />
  </head>
  <body>
    <!-- 시연 화면: 휴대폰 모양 틀 안에 실제 앱(/?phone)을 띄워요. 화면 높이에 맞춰 자동으로 크기를 맞춰요 -->
    <!-- 휴대폰 양옆: 왼쪽 팀 이름 · 오른쪽 앱 이름과 로고 -->
    <div class="side side-l"><p class="team">팀 아우름</p></div>
    <div class="side side-r"><p class="brand">푸른하늘</p><img class="logo" src="assets/icon-512.png" alt="푸른하늘 로고" /></div>
    <div class="stage">
      <div class="phone" id="phone">
        <span class="btn-side btn-action" aria-hidden="true"></span>
        <span class="btn-side btn-vol-up" aria-hidden="true"></span>
        <span class="btn-side btn-vol-down" aria-hidden="true"></span>
        <span class="btn-side btn-power" aria-hidden="true"></span>
        <div class="bezel">
          <div class="screen">
            <iframe id="app" src="/?phone" title="푸른하늘 앱" allow="geolocation; fullscreen"></iframe>
            <div class="status" aria-hidden="true">
              <span class="time" id="time">9:41</span>
              <span class="icons">
                <svg viewBox="0 0 18 12" class="sig"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <svg viewBox="0 0 16 12" class="wifi"><path d="M8 11.6 5.6 9.2a3.4 3.4 0 0 1 4.8 0L8 11.6Z"/><path d="M3.4 7a6.6 6.6 0 0 1 9.2 0l-1.3 1.3a4.8 4.8 0 0 0-6.6 0L3.4 7Z"/><path d="M1.1 4.7a9.8 9.8 0 0 1 13.8 0l-1.3 1.3a8 8 0 0 0-11.2 0L1.1 4.7Z"/></svg>
                <span class="batt"><i></i></span>
              </span>
            </div>
            <span class="home-bar" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
    <button type="button" class="fs-btn" id="fs">전체화면</button>
    <script src="demo.js?v=2026.10.11-phone5"></script>
  </body>
</html>
